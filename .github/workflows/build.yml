name: Test, build and publish

# The base image (sknnr/enshrouded-dedicated-server) is pinned by digest in the Dockerfile, so a
# push to main publishes exactly what was tested, and the base only moves when someone changes
# that pin. Publishing :latest DOES reach running servers: FluxOS's image update service checks
# every app's tag every six hours and soft-redeploys onto a new image, which restarts the server
# with no warning in game. So a scheduled run publishes only when there is something to apply
# (.github/ci/needs-rebuild.sh), since even a rebuild of unchanged inputs gets a new digest.

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays: a check, and a build only when needs-rebuild.sh finds commits on main (touching the
    # image inputs) that the published image does not have. The base is pinned, so there is no
    # security-update rule.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  IMAGE_NAME: runonflux/enshrouded-server-flux

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        run: |
          for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/*.py

      # Pinned, so "shellcheck is clean on my machine" means the same thing here.
      - name: Shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -x scripts/*.sh tests/*.sh .github/ci/*.sh

      - name: Unit tests
        run: ./tests/test-flux.sh

  # Is there anything to publish? Always yes for a push or a manual run; for the scheduled run, see
  # .github/ci/needs-rebuild.sh.
  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The check compares the published image's revision label with this history.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - id: check
        run: .github/ci/needs-rebuild.sh "${IMAGE_NAME}"

  build:
    needs: [test, check]
    # A pull request gets the tests and nothing else: it must not publish. A scheduled run with
    # nothing new stops at the check.
    if: github.event_name != 'pull_request' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FLUX_IMAGE_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must still have what the supervisor calls: Wine, the base image's
      # SteamCMD where the scripts expect them, tzdata for TZ, and the scripts themselves.
      - name: Smoke test the published image
        run: |
          docker run --rm --entrypoint bash "${IMAGE_NAME}:${{ github.sha }}" -c '
            set -e
            test "$(id -u)" = 10000
            wine --version | grep -q "^wine-10"
            command -v wineboot wineserver >/dev/null
            test -x "${STEAMCMD_PATH}/steamcmd.sh"
            test -f /usr/share/zoneinfo/Europe/Lisbon
            test -f /home/steam/enshrouded_server_example.json
            command -v pgrep pkill jq python3 flux-a2s >/dev/null
            flux-a2s 1 >/dev/null 2>&1 || [ $? = 1 ]
            bash -n /opt/flux/flux-entrypoint.sh
            bash -n /opt/flux/flux-scheduler.sh
            # flux.log is on the install path (the ml: mount on Flux), and the banner is printed
            out="$(bash -c "source /opt/flux/flux-lib.sh; flux_banner Enshrouded")"
            grep -q "Enshrouded server image by FluxCloud - https://runonflux.com" <<<"${out}"
            grep -q "Host this and 30+ other games" /home/steam/enshrouded/flux/flux.log
          '
