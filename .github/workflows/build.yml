name: Test, build and publish

# The base image (sknnr/enshrouded-dedicated-server) is pinned by digest in the Dockerfile, so a
# push to main publishes exactly what was tested, and the base only moves when someone changes
# that pin. Publishing :latest does not touch running servers: a Flux app only takes a new image
# when its spec is updated or it is redeployed.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: runonflux/enshrouded-server-flux

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        run: |
          for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/*.py

      # Pinned, so "shellcheck is clean on my machine" means the same thing here.
      - name: Shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -x scripts/*.sh tests/*.sh

      - name: Unit tests
        run: ./tests/test-flux.sh

  build:
    needs: test
    # A pull request gets the tests and nothing else: it must not publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FLUX_IMAGE_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must still have what the supervisor calls: the base image's Proton and
      # SteamCMD where the scripts expect them, tzdata for TZ, and the scripts themselves.
      - name: Smoke test the published image
        run: |
          docker run --rm --entrypoint bash "${IMAGE_NAME}:${{ github.sha }}" -c '
            set -e
            test "$(id -u)" = 10000
            test -x "${STEAMCMD_PATH}/compatibilitytools.d/GE-Proton${GE_PROTON_VERSION}/proton"
            test -x "${STEAMCMD_PATH}/steamcmd.sh"
            test -f /usr/share/zoneinfo/Europe/Lisbon
            test -f /home/steam/enshrouded_server_example.json
            command -v pgrep pkill jq python3 flux-a2s >/dev/null
            flux-a2s 1 >/dev/null 2>&1 || [ $? = 1 ]
            bash -n /opt/flux/flux-entrypoint.sh
            bash -n /opt/flux/flux-scheduler.sh
          '
